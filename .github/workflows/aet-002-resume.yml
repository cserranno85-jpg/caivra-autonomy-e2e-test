name: AET-002 Autonomous recovery
on:
  workflow_run:
    workflows: ["AET-002 Deliberate interruption"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  recover:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download original checkpoint
        uses: actions/download-artifact@v4
        with:
          name: aet-002-checkpoint
          path: recovery-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Resume with SHA validation
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: python recovery/checkpoint.py resume --sha "$SHA" --input recovery-input/checkpoint.json --output resume-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: aet-002-resume-report
          path: resume-report.json
          if-no-files-found: error
          retention-days: 7
